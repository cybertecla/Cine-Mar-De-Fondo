<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
   "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es" xml:lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Cine Mar de Fondo - Reservar Entradas</title>
<link rel="stylesheet" type="text/css" href="estilos.css" />
</head>
<body>

<h1 id="arriba">Cine Mar de Fondo</h1>

<ul>
<li><a href="index.html">Cartelera</a></li>
<li><a href="reserva.html">Reservar entradas</a></li>
</ul>

<form action="" method="get">

<fieldset>
<legend>Tus datos</legend>

<label for="nombre">Nombre:</label>
<input type="text" name="nombre" id="nombre" />

<label for="telefono">Teléfono:</label>
<input type="text" name="telefono" id="telefono" />

</fieldset>

<fieldset>
<legend>Tu reserva</legend>

<label for="pelicula">Película:</label>
<select name="pelicula" id="pelicula">
<option value="pelicula1">Película 1</option>
<option value="pelicula2">Película 2</option>
<option value="pelicula3">Película 3</option>
</select>

<p>
<label for="sesion17">17:00</label>
<input type="radio" name="sesion" id="sesion17" value="17:00" />

<label for="sesion19">19:30</label>
<input type="radio" name="sesion" id="sesion19" value="19:30" />

<label for="sesion22">22:00</label>
<input type="radio" name="sesion" id="sesion22" value="22:00" />
</p>

<p>
<label for="palomitas">Palomitas</label>
<input type="checkbox" name="extras" id="palomitas" value="palomitas" />

<label for="refresco">Refresco</label>
<input type="checkbox" name="extras" id="refresco" value="refresco" />

<label for="butaca">Butaca preferente</label>
<input type="checkbox" name="extras" id="butaca" value="butaca" />
</p>

<textarea name="observaciones" id="observaciones" rows="3" cols="40"></textarea>

<p>
<input type="submit" value="Enviar" />
<input type="reset" value="Restablecer" />
</p>

</fieldset>

</form>

<p>
Al enviar, los datos aparecerán en la barra de direcciones del navegador.
</p>

</body>
</html>
